<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <title>עורך אקורדים מלא</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; height: 100vh; margin: 0; background: #ecf0f1; }
        #sidebar { width: 250px; background: #2c3e50; color: white; padding: 20px; overflow-y: auto; }
        #main { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        .song-btn { display: block; width: 100%; padding: 10px; margin-bottom: 5px; cursor: pointer; background: #34495e; color: white; border: none; text-align: right; }
        .song-btn:hover { background: #1abc9c; }
        #editor { background: white; padding: 40px; min-height: 500px; outline: none; border: 1px solid #ccc; font-size: 18px; line-height: 2; transition: font-size 0.2s; }
        .word-box { display: inline-block; text-align: center; margin: 0 3px; cursor: pointer; }
        .chord { display: block; color: blue; font-weight: bold; font-family: monospace; line-height: 1; }
        .lyric { display: block; color: red; font-weight: bold; line-height: 1; }
        .toolbar { margin-bottom: 20px; background: #fff; padding: 10px; border-radius: 5px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    </style>
</head>
<body>

<div id="sidebar">
    <h3>הסט-ליסט שלי</h3>
    <button onclick="createNewSong()">+ שיר חדש</button>
    <button onclick="exportAllSongs()" style="margin-top:10px; background:#27ae60; color:white; border:none; padding:8px; cursor:pointer; width:100%;">💾 שמור סט-ליסט</button>
    <button onclick="importAllSongs()" style="margin-top:5px; background:#c0392b; color:white; border:none; padding:8px; cursor:pointer; width:100%;">📂 טען סט-ליסט</button>
    <div id="songList" style="margin-top:20px;"></div>
</div>

<div id="main">
    <div class="toolbar">
        <input type="text" id="songTitle" placeholder="שם השיר">
        <button onclick="addChord()">➕ אקורד</button>
        <button onclick="document.execCommand('undo')">↩️ Undo</button>
        <button onclick="generateLink()" style="background:skyblue;">🔗 קישור לשיתוף</button>
        <label>גודל:</label>
        <input type="range" min="14" max="40" value="18" oninput="changeFontSize(this.value)">
        <button onclick="exportToExcel()" style="background:darkgreen; color:white;">📊 ייצא לאקסל (2 טורים)</button>
        <button onclick="saveCurrentSong()" style="background:green; color:white;">שמור שיר</button>
    </div>
    <div id="editor" contenteditable="true" ondblclick="handleDblClick(event)"></div>
</div>

<script>
    let songs = [];
    try {
        const savedData = localStorage.getItem('mySongs');
        if (savedData && savedData !== 'undefined' && savedData !== 'null') {
            songs = JSON.parse(savedData);
        }
    } catch (e) {
        console.error("שגיאה בטעינת שירים מהזיכרון", e);
        songs = [];
    }
    
    let currentIdx = -1;

    window.onload = () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('data')) {
            try {
                const data = JSON.parse(decodeURIComponent(escape(atob(urlParams.get('data')))));
                document.getElementById('songTitle').value = data.title;
                document.getElementById('editor').innerHTML = data.content;
            } catch(e) { console.error("Error loading shared song", e); }
        }
        renderList();
    };

    function changeFontSize(size) {
        const editor = document.getElementById('editor');
        editor.style.fontSize = size + "px";
        editor.querySelectorAll('*').forEach(el => el.style.fontSize = size + "px");
    }

    function generateLink() {
        const data = { title: document.getElementById('songTitle').value, content: document.getElementById('editor').innerHTML };
        const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
        prompt("העתק את הקישור לשיתוף:", window.location.origin + window.location.pathname + '?data=' + encoded);
    }

    // --- אלגוריתם הפיצול ל-2 טורים באקסל ---
    function exportToExcel() {
        const editor = document.getElementById('editor');
        const blocks = [];
        let chordRow = [];
        let lyricRow = [];
        let hasChords = false;
        let currentPlainText = "";

        const generateStyledCell = (value, colorHex) => {
            return { v: value, t: 's', s: { font: { color: { rgb: colorHex } } } };
        };

        const flushText = () => {
            if (currentPlainText !== "") {
                chordRow.push(""); 
                lyricRow.push(generateStyledCell(currentPlainText, "000000"));
                currentPlainText = "";
            }
        };

        // אורז את השורות ל"בלוק" אחד של משפט (כדי לא לפצל אקורד מהמילה שלו)
        const flushLine = () => {
            flushText();
            const currentBlock = [];
            if (lyricRow.length > 0 || chordRow.length > 0) {
                if (hasChords) {
                    currentBlock.push(chordRow);
                }
                currentBlock.push(lyricRow);
            } else {
                currentBlock.push([]); 
            }
            blocks.push(currentBlock);
            chordRow = [];
            lyricRow = [];
            hasChords = false;
        };

        const processChordLyricPair = (chord, lyric) => {
            flushText();
            chordRow.push(generateStyledCell(chord, "0000FF")); // אקורד בכחול
            lyricRow.push(generateStyledCell(lyric, "FF0000")); // הברה באדום
            if (chord.trim() !== '') hasChords = true;
        };

        const parseNode = (n) => {
            if (n.nodeType === 3) { 
                const text = n.textContent.replace(/\n/g, ''); 
                if (text) currentPlainText += text;
            } else if (n.nodeName === 'BR') {
                flushLine(); 
            } else if (n.classList && n.classList.contains('word-box')) { 
                const chordNode = n.querySelector('.chord');
                const lyricNode = n.querySelector('.lyric');
                processChordLyricPair(chordNode.innerText, lyricNode.innerText);
            } else if (n.nodeName === 'DIV' || n.nodeName === 'P') {
                if (currentPlainText !== "" || lyricRow.length > 0) {
                    flushLine();
                }
                n.childNodes.forEach(parseNode);
                flushLine();
            } else {
                n.childNodes.forEach(parseNode);
            }
        };

        editor.childNodes.forEach(parseNode);
        if (currentPlainText !== "" || lyricRow.length > 0) {
            flushLine();
        }

        // ניקוי רווחים מיותרים
        const cleanBlocks = [];
        for (let i = 0; i < blocks.length; i++) {
            const isCurrentEmpty = blocks[i].length === 1 && blocks[i][0].length === 0;
            const isPrevEmpty = i > 0 && cleanBlocks.length > 0 && 
                                cleanBlocks[cleanBlocks.length-1].length === 1 && 
                                cleanBlocks[cleanBlocks.length-1][0].length === 0;
            if (isCurrentEmpty && isPrevEmpty) continue; 
            if (i === 0 && isCurrentEmpty) continue; 
            cleanBlocks.push(blocks[i]);
        }

        // חיפוש חכם של האמצע (עדיפות לשבירה על שורת רווח בין בתים)
        let splitIdx = Math.ceil(cleanBlocks.length / 2);
        for (let offset = 0; offset < 5; offset++) {
            if (splitIdx + offset < cleanBlocks.length && cleanBlocks[splitIdx + offset].length === 1 && cleanBlocks[splitIdx + offset][0].length === 0) {
                splitIdx = splitIdx + offset + 1; break;
            }
            if (splitIdx - offset > 0 && cleanBlocks[splitIdx - offset].length === 1 && cleanBlocks[splitIdx - offset][0].length === 0) {
                splitIdx = splitIdx - offset + 1; break;
            }
        }

        // חלוקת השיר לחצי ראשון וחצי שני
        const firstHalfBlocks = cleanBlocks.slice(0, splitIdx);
        const secondHalfBlocks = cleanBlocks.slice(splitIdx);

        // פריסה לשורות רגילות
        const col1Rows = []; // טור ימני באקסל
        firstHalfBlocks.forEach(b => b.forEach(r => col1Rows.push(r)));
        
        const col2Rows = []; // טור שמאלי באקסל
        secondHalfBlocks.forEach(b => b.forEach(r => col2Rows.push(r)));

        // מציאת הרוחב של הטור הראשון כדי לדעת איפה להתחיל את השני
        let maxCols = 0;
        col1Rows.forEach(r => { if(r.length > maxCols) maxCols = r.length; });
        const secondColStart = maxCols + 2; // רווח של שתי עמודות בין הטורים

        const maxRowsCount = Math.max(col1Rows.length, col2Rows.length);
        const finalRows = [];
        
        // הדבקה של שני הטורים זה לצד זה
        for (let i = 0; i < maxRowsCount; i++) {
            const newRow = new Array(secondColStart).fill("");
            
            // מילוי החצי הראשון (ימין)
            if (col1Rows[i]) {
                for (let j = 0; j < col1Rows[i].length; j++) {
                    newRow[j] = col1Rows[i][j];
                }
            }
            
            // מילוי החצי השני (שמאל)
            if (col2Rows[i]) {
                for (let j = 0; j < col2Rows[i].length; j++) {
                    newRow[secondColStart + j] = col2Rows[i][j];
                }
            }
            finalRows.push(newRow);
        }

        const ws = XLSX.utils.aoa_to_sheet(finalRows);
        ws['!views'] = [{ rightToLeft: true }]; 

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "שיר");
        XLSX.writeFile(wb, (document.getElementById('songTitle').value || 'song') + ".xlsx");
    }

    function handleDblClick(e) {
        if (e.target.classList.contains('chord')) {
            const newChord = prompt("ערוך אקורד:", e.target.innerText);
            if (newChord) e.target.innerText = newChord;
        }
    }

    function createNewSong() {
        const title = prompt("שם השיר:");
        if (!title) return;
        songs.push({ title, content: '<div>התחל להקליד...</div>' });
        saveAll();
        renderList();
    }

    function saveCurrentSong() {
        if (currentIdx === -1) return alert("בחר שיר");
        songs[currentIdx].title = document.getElementById('songTitle').value;
        songs[currentIdx].content = document.getElementById('editor').innerHTML;
        saveAll();
        renderList();
    }

    function saveAll() { localStorage.setItem('mySongs', JSON.stringify(songs)); }

    function exportAllSongs() {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(songs)], {type: 'application/json'}));
        a.download = 'my-songs.json';
        a.click();
    }

    function importAllSongs() {
        const input = document.createElement('input');
        input.type = 'file';
        input.onchange = e => {
            const reader = new FileReader();
            reader.onload = r => { localStorage.setItem('mySongs', r.target.result); location.reload(); }
            reader.readAsText(e.target.files[0]);
        }
        input.click();
    }

    function renderList() {
        const list = document.getElementById('songList');
        list.innerHTML = '';
        songs.forEach((s, i) => {
            const btn = document.createElement('button');
            btn.className = 'song-btn';
            btn.innerText = s.title;
            btn.onclick = () => {
                currentIdx = i;
                document.getElementById('songTitle').value = s.title;
                document.getElementById('editor').innerHTML = s.content;
            };
            list.appendChild(btn);
        });
    }

    function addChord() {
        const sel = window.getSelection();
        if (sel.isCollapsed) return alert("סמן הברה!");
        const chord = prompt("אקורד:");
        if (!chord) return;
        const html = `<span class="word-box" contenteditable="false"><span class="chord">${chord}</span><span class="lyric">${sel.toString()}</span></span>`;
        document.execCommand('insertHTML', false, html);
    }

    renderList();
</script>
</body>
</html>
