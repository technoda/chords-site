<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <title>עורך אקורדים מלא</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; height: 100vh; margin: 0; background: #ecf0f1; }
        #sidebar { width: 250px; background: #2c3e50; color: white; padding: 20px; overflow-y: auto; }
        #main { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        .song-btn { display: block; width: 100%; padding: 10px; margin-bottom: 5px; cursor: pointer; background: #34495e; color: white; border: none; text-align: right; }
        .song-btn:hover { background: #1abc9c; }
        #editor { background: white; padding: 40px; min-height: 500px; outline: none; border: 1px solid #ccc; transition: font-size 0.2s; }
        .word-box { display: inline-block; text-align: center; margin: 0 3px; cursor: pointer; }
        .chord { display: block; color: blue; font-weight: bold; font-family: monospace; }
        .lyric { display: block; color: red; font-weight: bold; }
        .toolbar { margin-bottom: 20px; background: #fff; padding: 10px; border-radius: 5px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    </style>
</head>
<body>

<div id="sidebar">
    <h3>הסט-ליסט שלי</h3>
    <button onclick="createNewSong()">+ שיר חדש</button>
    <button onclick="exportAllSongs()" style="margin-top:10px; background:#27ae60;">💾 שמור סט-ליסט</button>
    <button onclick="importAllSongs()" style="margin-top:5px; background:#c0392b;">📂 טען סט-ליסט</button>
    <div id="songList" style="margin-top:20px;"></div>
</div>

<div id="main">
    <div class="toolbar">
        <input type="text" id="songTitle" placeholder="שם השיר">
        <button onclick="addChord()">➕ אקורד</button>
        <button onclick="document.execCommand('undo')">↩️ Undo</button>
        <button onclick="exportToExcel()" style="background:darkgreen; color:white;">📊 ייצא ל-Excel</button>
        <button onclick="saveCurrentSong()" style="background:green; color:white;">שמור שיר</button>
    </div>
    <div id="editor" contenteditable="true" ondblclick="handleDblClick(event)"></div>
</div>

<script>
    let songs = JSON.parse(localStorage.getItem('mySongs') || '[]');
    let currentIdx = -1;

    function exportToExcel() {
        const editor = document.getElementById('editor');
        const rows = [];
        // לוקחים כל DIV כשורת טקסט
        const lines = editor.querySelectorAll('div');
        lines.forEach(line => {
            const row = [];
            line.querySelectorAll('.word-box').forEach(word => {
                row.push(word.querySelector('.chord').innerText);
                row.push(word.querySelector('.lyric').innerText);
            });
            rows.push(row);
        });

        const ws = XLSX.utils.aoa_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
        XLSX.writeFile(wb, (document.getElementById('songTitle').value || 'song') + ".xlsx");
    }

    function handleDblClick(e) {
        if (e.target.classList.contains('chord')) {
            const newChord = prompt("ערוך אקורד:", e.target.innerText);
            if (newChord) e.target.innerText = newChord;
        }
    }

    function createNewSong() {
        const title = prompt("שם השיר:");
        if (!title) return;
        songs.push({ title, content: '<div></div>' });
        saveAll();
        renderList();
    }

    function saveCurrentSong() {
        if (currentIdx === -1) return alert("בחר שיר");
        songs[currentIdx].title = document.getElementById('songTitle').value;
        songs[currentIdx].content = document.getElementById('editor').innerHTML;
        saveAll();
        renderList();
    }

    function saveAll() { localStorage.setItem('mySongs', JSON.stringify(songs)); }

    function renderList() {
        const list = document.getElementById('songList');
        list.innerHTML = '';
        songs.forEach((s, i) => {
            const btn = document.createElement('button');
            btn.className = 'song-btn';
            btn.innerText = s.title;
            btn.onclick = () => {
                currentIdx = i;
                document.getElementById('songTitle').value = s.title;
                document.getElementById('editor').innerHTML = s.content;
            };
            list.appendChild(btn);
        });
    }

    function addChord() {
        const sel = window.getSelection();
        if (sel.isCollapsed) return alert("סמן הברה!");
        const chord = prompt("אקורד:");
        if (!chord) return;
        const html = `<span class="word-box" contenteditable="false"><span class="chord">${chord}</span><span class="lyric">${sel.toString()}</span></span>`;
        document.execCommand('insertHTML', false, html);
    }

    function exportAllSongs() {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([localStorage.getItem('mySongs')], {type: 'application/json'}));
        a.download = 'my-songs.json';
        a.click();
    }

    function importAllSongs() {
        const input = document.createElement('input');
        input.type = 'file';
        input.onchange = e => {
            const reader = new FileReader();
            reader.onload = r => { localStorage.setItem('mySongs', r.target.result); location.reload(); }
            reader.readAsText(e.target.files[0]);
        }
        input.click();
    }

    renderList();
</script>
</body>
</html>
