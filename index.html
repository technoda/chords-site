<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <title>עורך שירים</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f4; }
        .toolbar { margin-bottom: 15px; padding: 10px; background: white; border-radius: 5px; }
        .editor { 
            width: 100%; max-width: 800px; margin: auto; border: 1px solid #ccc; 
            padding: 30px; min-height: 500px; background: white; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        /* מחלקה לפיצול ל-2 טורים */
        .columns { column-count: 2; column-gap: 40px; }
        
        .word { display: inline-block; text-align: center; margin: 0 5px; line-height: 1.5; }
        .chord { color: blue; font-weight: bold; display: block; font-family: monospace; font-size: 16px; }
        .lyric { color: black; font-weight: bold; display: block; font-size: 18px; }
        
        button { padding: 8px 15px; cursor: pointer; background: #3498db; color: white; border: none; border-radius: 4px; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>

    <div class="toolbar">
        <button onclick="addChord()">➕ הוסף אקורד</button>
        <button onclick="toggleColumns()" style="background:#27ae60;">📰 הכן לדוקס (טורים)</button>
        <span> &nbsp; &nbsp; הוראה: סמן מילה, לחץ על אקורד, ואז העתק-הדבק לדוקס.</span>
    </div>

    <div id="editor" class="editor" contenteditable="true">
        <div>התחל להקליד כאן את מילות השיר...</div>
    </div>

    <script>
        function addChord() {
            const sel = window.getSelection();
            if (sel.rangeCount === 0 || sel.toString() === "") {
                alert("סמן את המילה שמעליה תרצה להוסיף אקורד");
                return;
            }
            const chord = prompt("הכנס אקורד:");
            if (!chord) return;
            
            const html = `<span class="word"><span class="chord">${chord}</span><span class="lyric">${sel.toString()}</span></span>`;
            document.execCommand('insertHTML', false, html);
        }

        function toggleColumns() {
            document.getElementById('editor').classList.toggle('columns');
        }
    </script>
</body>
</html>
