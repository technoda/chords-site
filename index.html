<div id="sidebar">
    <h3>הסט-ליסט שלי</h3>
    <button onclick="createNewSong()">+ שיר חדש</button>
    <button onclick="exportAllSongs()" style="margin-top:10px; background:#27ae60;">💾 שמור סט-ליסט לקובץ</button>
    <button onclick="importAllSongs()" style="margin-top:5px; background:#c0392b;">📂 טען סט-ליסט מקובץ</button>
    <div id="songList" style="margin-top:20px;"></div>
</div>

<script>
    // הוסף את הפונקציות האלו בסוף הסקריפט:
    function exportAllSongs() {
        const data = localStorage.getItem('mySongs');
        const blob = new Blob([data], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'my-songs.json';
        a.click();
    }

    function importAllSongs() {
        const input = document.createElement('input');
        input.type = 'file';
        input.onchange = e => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = readerEvent => {
                const content = readerEvent.target.result;
                localStorage.setItem('mySongs', content);
                songs = JSON.parse(content);
                renderList();
                location.reload(); // רענון כדי לטעון הכל
            }
            reader.readAsText(file);
        }
        input.click();
    }
</script>
